# Module 9: the checks too slow or too heavy for every push (project_plan/
# 09-testing-strategy.md §5 items 4 and 5). They need the trained classifier
# (~740 MB, not in git), which this workflow downloads from the project's
# private Hugging Face backup. That needs a read token stored as the
# repository secret HF_TOKEN; without it the workflow fails and says so,
# rather than skipping the checks silently.
name: Full checks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: full-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_REPO: Chinmayyyyy/genai-gateway-classifier

jobs:
  model:
    name: Real-model tests and offline evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            gateway/requirements.txt
            training/requirements.txt

      - name: Install dependencies
        run: |
          pip install --retries 10 --timeout 60 torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 10 --timeout 60 -r gateway/requirements.txt
          # Only what the two evaluation scripts import (not the RL training stack).
          pip install --retries 10 --timeout 60 datasets scikit-learn huggingface_hub==1.33.0

      - name: Download the trained classifier and the held-out data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set: these checks need the trained classifier from $HF_REPO."
            exit 1
          fi
          # The cached classifier scores (bandit_scores_*) are deliberately
          # not downloaded: the evaluation re-scores with the shipped model.
          # One --include per pattern: `--include a b` takes b as a filename
          # and then ignores the patterns altogether.
          hf download "$HF_REPO" --local-dir hf --include "classifier_v2/*" \
            --include "data/test.jsonl" --include "data/val.jsonl" \
            --include "data/v2/test.jsonl" --include "data/v2/val.jsonl"
          mkdir -p training/checkpoints training/data/v2
          mv hf/classifier_v2 training/checkpoints/final
          mv hf/data/test.jsonl hf/data/val.jsonl training/data/
          mv hf/data/v2/test.jsonl hf/data/v2/val.jsonl training/data/v2/
          test -f training/checkpoints/final/config.json

      - name: Full-pipeline and security tests with the real classifier
        working-directory: gateway
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          set -o pipefail
          pytest -rs tests/test_full_pipeline.py tests/test_classifier.py \
            tests/test_security_boundaries.py | tee ../pytest-real-model.log
          # Here nothing may be skipped: a skip would mean the model or a
          # backend wasn't really used.
          if grep -q "SKIPPED" ../pytest-real-model.log; then
            echo "::error::tests were skipped in the full-checks run"; exit 1
          fi

      - name: Classifier evaluation (module 5, locked v2 test set)
        env:
          # The evaluation scripts import the gateway's settings.
          POSTGRES_DSN: postgresql://unused:unused@localhost:5432/unused
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: unused
          ANTHROPIC_API_KEY: unused
          REDACTION_VAULT_KEY: CsmRGHfMdzTqw8f6YCOh6vsLs9cAxgnDuoEDsPMOrw0=
        run: |
          set -o pipefail
          mkdir -p eval
          python training/evaluate.py --test-file training/data/v2/test.jsonl \
            --output eval/classifier_v2_test.json 2>&1 | tee eval/classifier.log

      - name: Bandit evaluation (module 6a, v2 splits)
        env:
          POSTGRES_DSN: postgresql://unused:unused@localhost:5432/unused
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: unused
          ANTHROPIC_API_KEY: unused
          REDACTION_VAULT_KEY: CsmRGHfMdzTqw8f6YCOh6vsLs9cAxgnDuoEDsPMOrw0=
        run: |
          set -o pipefail
          python training/evaluate_bandit.py --data v2 2>&1 | tee eval/bandit.log
          cp training/checkpoints/bandit_eval_v2.json eval/

      - name: Publish the numbers
        if: always()
        run: |
          {
            echo "## Classifier on the locked v2 test set"
            echo '```'
            grep -vE "^(INFO|WARNING):(httpx|urllib3)" eval/classifier.log 2>/dev/null | tail -30
            echo '```'
            echo "## Bandit vs static thresholds (v2 splits)"
            # Its log is already Markdown tables.
            sed -n '/^## Experiment/,$p' eval/bandit.log 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY" || true  # nothing to publish if an earlier step failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: |
            eval/
            pytest-real-model.log
          if-no-files-found: warn

  e2e:
    name: Dashboard browser tests against the Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure a throwaway environment
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set: the gateway can't start without the trained classifier from $HF_REPO."
            exit 1
          fi
          # Set here, masked, so scripts/reset_demo.sh doesn't generate and
          # print it into the log. Everything else it generates itself.
          PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$PASSWORD"
          cp .env.example .env
          {
            echo "HF_TOKEN=$HF_TOKEN"
            echo "DEMO_ADMIN_USERNAME=e2e-ci"
            echo "DEMO_ADMIN_PASSWORD=$PASSWORD"
          } >> .env
          echo "E2E_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Start and seed the stack exactly as for a demo
        # The model job downloads the classifier (HF_TOKEN); migrate sets up
        # the database and the gateway's role; seed-traffic sends the demo
        # requests. No Ollama here: answers fail upstream (502) and are
        # audited like the rest.
        run: ./scripts/reset_demo.sh --yes

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Run the browser tests
        working-directory: dashboard
        env:
          E2E_ADMIN_USER: e2e-ci
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Stack logs on failure
        if: failure()
        # The stack may never have started (e.g. no .env yet).
        run: docker compose logs --tail 200 || true
