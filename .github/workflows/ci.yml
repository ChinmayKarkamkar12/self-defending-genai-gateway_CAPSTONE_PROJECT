name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gateway/requirements.txt

      - name: Install dependencies
        # CPU torch first so requirements.txt's torch pin is already met and
        # pip doesn't download the CUDA wheel. The spaCy model isn't a PyPI
        # package; Presidio (module 4) needs it at test time.
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest
