name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    services:
      # For tests/test_audit_postgres.py (migrations, the append-only
      # trigger, hash round trips through JSONB/numeric/timestamptz) and the
      # postgres variants of module 9's cross-cutting tests
      # (tests/pipeline_stack.py), which are skipped when TEST_POSTGRES_DSN /
      # TEST_REDIS_URL aren't set.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gateway/requirements.txt

      - name: Install dependencies
        # CPU torch first so requirements.txt's torch pin is already met and
        # pip doesn't download the CUDA wheel. requirements.txt also installs
        # the spaCy model Presidio (module 4) needs, as a pinned wheel.
        run: |
          pip install --retries 10 --timeout 60 torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 10 --timeout 60 -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (with coverage)
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/15
        # -rs lists every skipped test and why, so a skip can't hide in the
        # dots: tests/test_full_pipeline.py and tests/test_classifier.py need
        # the trained checkpoint, which only the full-checks workflow has.
        run: pytest -rs --cov --cov-report=term

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
