name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gateway/requirements.txt

      - name: Install dependencies
        # CPU torch first so requirements.txt's torch pin is already met and
        # pip doesn't download the CUDA wheel. requirements.txt also installs
        # the spaCy model Presidio (module 4) needs, as a pinned wheel.
        run: |
          pip install --retries 10 --timeout 60 torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --retries 10 --timeout 60 -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest
